version: 2
updates:
  # Keep GitHub Actions pins (full SHAs + # vX.Y.Z comments) fresh through
  # reviewed draft PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Dev tooling only. Upstream engine pins (pi-web-access, rpiv-todo,
  # rpiv-i18n, pi-subagents) are managed exclusively by the check-upstream
  # workflow + maintenance/manifest.json so unreviewed bumps cannot silently
  # drift the adapters or the contract snapshot away from the manifest.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "pi-web-access"
      - dependency-name: "@juicesharp/rpiv-todo"
      - dependency-name: "@juicesharp/rpiv-i18n"
      - dependency-name: "@tintinweb/pi-subagents"
