name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only for every event (including PRs from forks). No secrets are used
# for pull request builds and no write permission is requested.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + contracts + production + audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout (read-only, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.1"

      - name: Install dependencies (no lifecycle scripts)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          npm ci --ignore-scripts 2>&1 | tee diagnostics/install.log

      - name: Typecheck and test (packages + root)
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee diagnostics/check.log

      - name: Offline maintenance pipeline (temporary clone, no model key)
        shell: bash
        run: |
          set -o pipefail
          npm run test:maintenance-pipeline -- diagnostics/maintenance-pipeline 2>&1 | tee diagnostics/maintenance-pipeline.log

      - name: Verify tracked tool-contract snapshot
        shell: bash
        run: |
          set -o pipefail
          npm run contracts:check 2>&1 | tee diagnostics/contracts-check.log

      - name: Verify fresh production install (self-contained host)
        shell: bash
        run: |
          set -o pipefail
          npm run verify:production 2>&1 | tee diagnostics/production-install.log

      - name: Security audit (all dependencies)
        run: npm audit --audit-level=high

      - name: Security audit (production/peer surface only)
        run: npm audit --omit=dev --audit-level=high

      - name: Write audit diagnostics (JSON)
        if: always()
        shell: bash
        run: |
          npm audit --json > diagnostics/audit-all.json 2> diagnostics/audit-all.stderr.log || true
          npm audit --omit=dev --json > diagnostics/audit-production.json 2> diagnostics/audit-production.stderr.log || true

      - name: Upload diagnostics (no node_modules, no credentials)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ matrix.os }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  all-platforms:
    name: all-platforms-pass
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every platform passed
        run: test "${{ needs.check.result }}" = "success"
