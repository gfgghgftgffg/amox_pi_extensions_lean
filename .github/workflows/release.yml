name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - packages/**
      - maintenance/**
  workflow_dispatch:
    inputs:
      tag:
        description: "Initial/retry manual release tag vX.Y.Z (matches root and all package versions)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Release only a reviewed version bump (or explicit manual request)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.1"
      - id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release-plan.mjs --run

  verify:
    name: Verify immutable SHA (${{ matrix.os }}, no secrets)
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.1"
      - name: Validate release context without token
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/create-release.mjs --verify-only
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run contracts:check
      - run: npm run verify:production
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/release-assets.mjs --build
        if: matrix.os == 'ubuntu-latest'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: release-assets
          path: .release-assets/
          # Contains only the validated archives and assets.json, no credentials.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create immutable tag + GitHub Release (no dependency execution)
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.1"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: .release-assets
      - name: Validate assets, atomically reserve tag and create release
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/create-release.mjs --assets-dir .release-assets

  npm:
    name: Optional independent npm publication (prebuilt archives only)
    needs: [plan, release]
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.1"
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: .release-assets
      - name: Publish individual packages without lifecycle scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-packages.mjs
